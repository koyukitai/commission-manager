async function issueDocument(id){
 if(!document.getElementById('issueAck')?.checked)return toast('確認にチェックしてください');
 const d=await get('documents',id);if(!d||d.status==='発行済み')return toast('対象の下書きが変更されました');
 // Build a snapshot using the current client and issuer data before committing.
 const kindCode=d.kind==='請求書'?'INV':'EST';
 try{
   const counterId='issue-counter-'+kindCode;
   const previous=await get('meta',counterId);
   const existing=await get('documents',id);
   if(!existing||existing.status!=='下書き')throw Error('発行対象が変更されました');
   const seq=(Number(previous?.value)||0)+1;
   const issueNumber=kindCode+'-'+new Date().getFullYear()+'-'+String(seq).padStart(6,'0');
   // Render the immutable snapshot before starting the atomic write transaction.
   const snapshot=await printDocumentSnapshot({...existing,issueNumber});
   const finalTx=db.transaction(['meta','documents'],'readwrite'),m=finalTx.objectStore('meta'),ds=finalTx.objectStore('documents');
   const currentCounter=await req(m.get(counterId));
   const currentDoc=await req(ds.get(id));
   if((Number(currentCounter?.value)||0)!==seq-1||!currentDoc||currentDoc.status!=='下書き')throw Error('別タブで発行情報が変更されました。もう一度実行してください');
   m.put({id:counterId,value:seq});ds.put({...currentDoc,status:'発行済み',issueNumber,issuedAt:now(),issuedHTML:snapshot,revisionNumber:currentDoc.revisionNumber||1,updated:now()});
   await done(finalTx);closeModal();await render();toast('正式発行しました：'+issueNumber);
 }catch(e){toast('正式発行できません：'+e.message)}
}

 const originalGet=window.__issueSnapshotDoc;
 window.__issueSnapshotDoc=d;
 try{return await printDocument(d.id,false,true)}finally{window.__issueSnapshotDoc=originalGet}
}

function txRow(x,ctx={}){

 const doc=x.documentId?ctx.documents?.find(d=>d.id===x.documentId):null;
 const clientName=client?.name||x.client||project?.clientName||'依頼者未設定';
 const isPayment=x.type==='入金';
 const total=Number(doc?.amount)||0;
 const related=doc?(ctx.transactions||[]).filter(t=>!t.deleted&&t.documentId===doc.id&&(t.type==='入金'||t.type==='返金')).sort((a,b)=>{
  const da=String(a.date||''),db=String(b.date||'');
  if(da!==db)return da.localeCompare(db);
  const ca=String(a.created||''),cb=String(b.created||'');
  if(ca!==cb)return ca.localeCompare(cb);
  return String(a.id||'').localeCompare(String(b.id||''));
 }):[];
 let running=0,netAtEntry=0,prior=0;
 for(const t of related){const before=running;running+=t.type==='入金'?(Number(t.amount)||0):-(Number(t.amount)||0);if(t.id===x.id){prior=before;netAtEntry=running;}}
 const currentNet=running;
 const remainingAtEntry=total-netAtEntry;
 const currentRemaining=total-currentNet;
 const paymentStage=doc&&isPayment?(netAtEntry<total?'一部入金':prior>0&&prior<total&&netAtEntry===total?'残金入金':netAtEntry===total?'全額入金':netAtEntry>total?'過入金':'入金記録'):null;
 const currentStatus=doc&&isPayment?(currentNet<=0?'未入金':currentNet<total?'一部入金':currentNet===total?'入金済み':'過入金'):null;
 const statusClass=currentStatus==='一部入金'?'partial':currentStatus==='入金済み'?'paid':currentStatus==='過入金'?'overpaid':'unpaid';
 const statusBadge=currentStatus?`<span class="tx-status ${statusClass}">${esc(lang==='ja'?currentStatus:({未入金:'Unpaid',一部入金:'Partially paid',入金済み:'Paid',過入金:'Overpaid'}[currentStatus]))}</span>`:'';
 const kindLabel=t(({入金:'payment',返金:'refund',充当:'allocation',再割当:'reallocation'})[x.type]||x.type);

 const paymentGrid=doc&&isPayment?`<div class="tx-payment-grid">
  <div class="tx-payment-stat"><span class="tx-stat-label">${lang==='ja'?'今回の入金':'This payment'}</span><span class="tx-stat-value">${money(x.amount)}</span><span class="tx-stat-hint">${esc(lang==='ja'?paymentStage:({一部入金:'Partial payment',残金入金:'Final payment',全額入金:'Full payment',過入金:'Overpayment',入金記録:'Payment'}[paymentStage]))}</span></div>
  <div class="tx-payment-stat"><span class="tx-stat-label">${lang==='ja'?'この入金後の累計':'Received after this entry'}</span><span class="tx-stat-value">${money(netAtEntry)}</span></div>
  <div class="tx-payment-stat remaining ${remainingAtEntry<=0?'cleared':''}"><span class="tx-stat-label">${lang==='ja'?(remainingAtEntry<0?'この入金後の過入金額':'この入金後の未入金残高'):(remainingAtEntry<0?'Overpaid after entry':'Balance after entry')}</span><span class="tx-stat-value">${money(Math.abs(remainingAtEntry))}</span></div>
 </div><div class="tx-current-summary">${lang==='ja'?'現在の請求状況':'Current invoice status'}：${esc(lang==='ja'?currentStatus:({未入金:'Unpaid',一部入金:'Partially paid',入金済み:'Paid',過入金:'Overpaid'}[currentStatus]))} ／ ${lang==='ja'?'現在の未入金残高':'Current balance'} ${money(Math.max(0,currentRemaining))}</div>`:'';
 return `<div class="listrow row"><div class="tx-history-main"><div class="tx-history-heading"><strong class="tx-history-client">${esc(clientName)}</strong>${statusBadge}${paymentStage?`<span class="tx-stage">${esc(lang==='ja'?paymentStage:({一部入金:'Partial payment',残金入金:'Final payment',全額入金:'Full payment',過入金:'Overpayment',入金記録:'Payment'}[paymentStage]))}</span>`:''}</div><div class="tx-history-meta">${summary}</div>${paymentGrid||`<div class="tx-history-meta">${money(x.amount)}</div>`}</div><div class="actions">${btn(t('detail'),`transactionDetail('${x.id}')`)}</div></div>`;
}

async function openTransactionFromInvoice(invoiceId){
 const d=await get('documents',invoiceId);
 if(!d||d.kind!=='請求書')return toast('請求書が見つかりません');
 if(d.status==='発行取消済み')return toast('発行取消済みの請求書には入金を登録できません');

 const c=d.clientId?await get('clients',d.clientId):(p?.clientId?await get('clients',p.clientId):null);
 const txs=(await all('transactions')).filter(x=>!x.deleted&&x.documentId===d.id);
 const received=txs.reduce((sum,x)=>sum+(x.type==='入金'?Number(x.amount):x.type==='返金'?-Number(x.amount):0),0);
 const remaining=Number(d.amount)-received;
 if(!Number.isSafeInteger(remaining)||remaining<=0)return toast(lang==='ja'?'この請求書には未入金残高がありません':'No unpaid balance remains for this invoice');
 await openTransaction(null,{type:'入金',date:today(),clientId:c?.id||'',client:c?.name||p?.clientName||'',projectId:p?.id||'',project:p?.name||'',amount:remaining,method:'銀行振込',invoice:d.issueNumber||d.title||d.id,documentId:d.id,source:'請求書から反映',memo:'',description:d.title||''});
}

async function aboutPage(){const ja=lang==='ja';return header(t('About'),ja?'ツールの概要・プライバシー・制作者情報':'Overview, privacy and creator information')+`<div class="settings-columns"><div class="settings-column"><section class="panel"><h2>${ja?'ツール概要・ご利用上の注意':'About this tool & important notes'}</h2><p>${ja?'Commission Managerは、クリエイター向けの案件・依頼者・予定・見積書・請求書・入金情報の管理ツールです。':'Commission Manager helps creators manage projects, clients, schedules, estimates, invoices and payments.'}</p><ul style="line-height:1.9;font-size:13px"><li>${ja?'帳票の発行・取消や入金記録を管理できますが、税務・会計上の要件をすべて自動検証するものではありません。実務で使用する前に内容をご確認ください。':'This tool manages document issuance, cancellation and payment records, but does not automatically verify all accounting or tax requirements. Review entries before business use.'}</li><li>${ja?'データは使用中のブラウザに保存されます。ブラウザデータの削除、端末故障、容量不足などで失われる場合があります。':'Data is stored locally in your browser and may be lost if browser data is cleared or the device fails.'}</li><li>${ja?'ZIPバックアップと完全復元に対応しています。復元すると現在のデータは置き換わります。JSON書き出しは補助的な機能です。':'ZIP backup and full restore are supported. Restoring replaces current data; JSON export is an additional option.'}</li><li>${ja?'正式発行時に発行番号を付け、発行時点の帳票HTMLを保存します。PDFファイル自体の自動保存や電子署名・改ざん検知には対応していません。PDF保存にはブラウザの印刷機能を利用します。':'Issuance assigns a number and stores a snapshot of the document HTML. Automatic PDF file storage, digital signatures and tamper detection are not provided. PDF export uses browser printing.'}</li><li>${ja?'消費税・源泉徴収税は簡易試算です。実際の税務処理は専門家や公的資料で確認してください。':'Tax and withholding calculations are simplified estimates; verify actual requirements.'}</li><li>${ja?'複数タブでの同時編集、返金・充当・再割当などの取引整合性は完全には保証されません。登録前に内容を確認し、定期的にバックアップしてください。':'Concurrent editing and the integrity of refunds, allocations and reallocations are not fully guaranteed. Verify entries and back up data regularly.'}</li><li>${ja?'ロゴ・発行者情報はこのブラウザ内に保存され、他の端末には自動同期されません。':'Logo and issuer details stay in this browser and do not sync across devices.'}</li></ul></section><section class="panel privacy-panel"><h2>${ja?'データの保存とプライバシー':'Data storage & privacy'}</h2><p class="muted">${ja?'住所や振込先など、大切な情報の取り扱いについてご案内します。':'How your important information, including addresses and bank details, is handled.'}</p><div class="privacy-item"><strong>◈ ${ja?'お使いのブラウザ内に保存':'Stored in your browser'}</strong><p>${ja?'案件・依頼者・発行者・振込先などの登録情報は、このブラウザの保存領域に記録されます。':'Project, client, issuer and bank details are stored in this browser.'}</p></div><div class="privacy-item"><strong>◈ ${ja?'AI連携・制作者への自動共有なし':'No AI integration or automatic sharing with the creator'}</strong><p>${ja?'本ツールには、登録情報をAIに送信して記憶・学習・分析させる機能や、入力情報をツール制作者へ自動送信・共有する機能は設けておりませんので、安心してご利用ください。':'This tool does not include features that send your entries to AI for memory, training or analysis, or automatically transmit or share your entries with the creator.'}</p></div><div class="privacy-item"><strong>◈ ${ja?'利用時の注意点':'Important precautions'}</strong><p>${ja?'ただし、ブラウザ内に保存された情報が第三者から完全に保護されることを保証するものではありません。共有端末など、第三者が操作できる環境でのご利用にはご注意ください。また、ブラウザのデータ削除や端末の故障などにより、保存された情報が失われる場合があります。大切なデータは定期的にバックアップ（データの書き出し）することをおすすめします。':'However, information stored in your browser cannot be guaranteed to be completely protected from third parties. Please take care when using shared devices or any device that others can access. Stored information may be lost if browser data is cleared or your device fails. We recommend regularly backing up your important data using the export feature.'}</p></div><p class="muted" style="font-size:12px;margin-bottom:0">${ja?'※上記は本ツール自体の仕組みに関する説明です。ブラウザの拡張機能や端末上の別サービスの動作まで保証するものではありません。':'This describes the tool itself; it does not cover browser extensions or other services running on your device.'}</p></section></div><div class="settings-column"><section class="panel"><h2>${ja?'ツール制作者について':'About the creator'}</h2><p style="font-size:17px;font-weight:700;margin-bottom:8px">小幸たい <span class="muted" style="font-size:13px">/ KOYUKITAI</span></p><p>${ja?'本ツール「Commission Manager」は、VTuber活動とクリエイターとしての制作活動を行っている小幸たいが、依頼者とのやり取りや案件・見積書・請求書などを少しでも分かりやすく管理できるように制作しました。':'Commission Manager was created by KOYUKITAI, an active VTuber and creator, to make it easier to organize client work, projects, estimates, and invoices.'}</p><p>${ja?'イラスト・Live2D・デザイン・動画など、さまざまな制作活動で使いやすいツールを目指しています。今後も使いやすさや機能の改善を重ねていく予定です。':'It is designed for a range of creative work, including illustration, Live2D, design, and video. The aim is to keep improving usability and features.'}</p><div class="notice" style="margin:14px 0">${ja?'こちらはツールの制作クレジットです。見積書・請求書に表示される「発行者情報」とは別のものであり、利用者の帳票に制作者名が発行者として自動入力されることはありません。':'This is the tool creator credit, separate from the issuer information on your estimates and invoices. The creator name is not automatically used as the document issuer.'}</div><p><strong>${ja?'ご利用ありがとうございます！':'Thank you for using Commission Manager!'}</strong></p><p>${ja?'気に入っていただけたら、Xでのフォローやツールのシェアで応援してもらえると嬉しいです。いただいた応援は、これからの制作活動やツール改善の励みになります。':'If you enjoy the tool, following the creator on X or sharing it would mean a lot and help support future creative work and improvements.'}</p><p><a href="https://x.com/Tai__Koyuki" target="_blank" rel="noopener noreferrer" style="font-weight:700;color:var(--accent)">${ja?'制作者・小幸たいのXを見る ↗':'Visit KOYUKITAI on X ↗'}</a></p><p class="muted" style="font-size:12px">${ja?'※フォロー・シェアは任意であり、ツールの利用条件ではありません。':'Following and sharing are entirely optional and are not conditions of use.'}</p></section></div></div>`}
async function showDeletedTransactions(){let xs=(await all('transactions')).filter(x=>x.deleted);modal(`<div class="row"><h2>${lang==='ja'?'削除済み取引':'Removed transactions'}</h2>${btn(t('close'),'closeModal()')}</div>${xs.map(x=>row(esc(x.id),esc(x.type)+' / '+money(x.amount)+' / '+esc(x.deleteReason||''),btn(lang==='ja'?'詳細・復元':'Details / restore',`transactionDetail('${x.id}')`))).join('')||'<div class="empty">—</div>'}`)}async function exportData(){let data={version:'integrated-trial-1.3',exported:now()};for(let s of ['drafts','transactions','meta','clients','projects','events','documents'])data[s]=await all(s);let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='commission-manager-trial-1.3.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function confirmClear(){modal(`<h2>${lang==='ja'?'試験データを全削除':'Clear all trial data'}</h2><div class="notice warn">${lang==='ja'?'この操作は取り消せません。必要なら先にJSONを書き出してください。':'Cannot be undone. Export JSON first if needed.'}</div><label class="check"><input type="checkbox" id="clearAck">${lang==='ja'?'全削除を理解しました':'I understand'}</label><div class="actions">${btn(t('cancel'),'closeModal()')}${btn(lang==='ja'?'全削除':'Clear all','clearAll()','danger')}</div>`)}async function clearAll(){if(!document.getElementById('clearAck')?.checked)return toast('Confirmation required');let tr=db.transaction(['drafts','transactions','meta','clients','projects','events','documents'],'readwrite');for(let s of ['drafts','transactions','meta','clients','projects','events','documents'])tr.objectStore(s).clear();await done(tr);undo=[];closeModal();render()}function notify(){toast(lang==='ja'?'期限・納期の自動通知は今後の実装対象です':'Automated deadline notifications are not implemented yet')}

// Portable ZIP backup: one UTF-8 JSON payload, ZIP STORE (method 0), no external libraries.
const BACKUP_STORES=['drafts','transactions','meta','clients','projects','events','documents'];
const BACKUP_KEYS=['cm-ui-lang','cm-ui-theme','cm-custom-request-options','cm-pdf-address','cm-pdf-bank','cm-pdf-color','cm-pdf-invoiceid','cm-pdf-issuer','cm-pdf-logo','cm-pdf-style'];
const BACKUP_FILENAME='commission-manager-backup.json';
const backupEncoder=new TextEncoder(),backupDecoder=new TextDecoder('utf-8',{fatal:true});
const backupCrcTable=(()=>{let a=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;a.push(c>>>0)}return a})();
function backupCRC(bytes){let c=0xffffffff;for(let b of bytes)c=backupCrcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function backupZipEncode(bytes){
 const name=backupEncoder.encode(BACKUP_FILENAME),n=name.length,len=bytes.length,crc=backupCRC(bytes);
 const buf=new ArrayBuffer(30+n+len+46+n+22),out=new Uint8Array(buf),dv=new DataView(buf);let p=0;
 const w16=v=>{dv.setUint16(p,v,true);p+=2},w32=v=>{dv.setUint32(p,v,true);p+=4},wb=b=>{out.set(b,p);p+=b.length};
 w32(0x04034b50);w16(20);w16(0);w16(0);w16(0);w16(0);w32(crc);w32(len);w32(len);w16(n);w16(0);wb(name);wb(bytes);
 const cd=p;w32(0x02014b50);w16(20);w16(20);w16(0);w16(0);w16(0);w16(0);w32(crc);w32(len);w32(len);w16(n);w16(0);w16(0);w16(0);w16(0);w32(0);w32(0);wb(name);
 const cdlen=p-cd;w32(0x06054b50);w16(0);w16(0);w16(1);w16(1);w32(cdlen);w32(cd);w16(0);return new Blob([buf],{type:'application/zip'});
}
function backupZipDecode(buffer){
 const v=new DataView(buffer),a=new Uint8Array(buffer),size=a.length;
 if(size<98||size>32*1024*1024)throw Error('ZIPファイルのサイズが不正です（上限32MB）。');
 let e=-1;for(let i=size-22;i>=Math.max(0,size-65557);i--)if(v.getUint32(i,true)===0x06054b50&&i+22+v.getUint16(i+20,true)===size){e=i;break}
 if(e<0||v.getUint16(e+8,true)!==1||v.getUint16(e+10,true)!==1||v.getUint16(e+4,true)!==0||v.getUint16(e+6,true)!==0)throw Error('対応していないZIP形式です。');
 const cd=v.getUint32(e+16,true),cdlen=v.getUint32(e+12,true);if(cd+cdlen>e||cd+46>e||v.getUint32(cd,true)!==0x02014b50)throw Error('ZIPの目次が破損しています。');
 const flags=v.getUint16(cd+8,true),method=v.getUint16(cd+10,true),crc=v.getUint32(cd+16,true),compressed=v.getUint32(cd+20,true),uncompressed=v.getUint32(cd+24,true),nameLen=v.getUint16(cd+28,true),extraLen=v.getUint16(cd+30,true),commentLen=v.getUint16(cd+32,true),local=v.getUint32(cd+42,true);
 if(flags!==0||method!==0||compressed!==uncompressed||uncompressed>30*1024*1024||cd+46+nameLen+extraLen+commentLen!==cd+cdlen||local+30>cd)throw Error('このZIP形式は復元できません。');
 const name=backupDecoder.decode(a.subarray(cd+46,cd+46+nameLen));if(name!==BACKUP_FILENAME||v.getUint32(local,true)!==0x04034b50||v.getUint16(local+8,true)!==0||v.getUint16(local+6,true)!==0)throw Error('Commission Managerのバックアップではありません。');
 const localName=v.getUint16(local+26,true),localExtra=v.getUint16(local+28,true),start=local+30+localName+localExtra;
 if(start+compressed>cd||backupDecoder.decode(a.subarray(local+30,local+30+localName))!==name)throw Error('ZIPの内容が破損しています。');
 const data=a.subarray(start,start+compressed);if(backupCRC(data)!==crc)throw Error('ZIPのチェックサムが一致しません。');return backupDecoder.decode(data);
}
async function downloadBackupZip(){
 try{const data={format:'commission-manager-full-backup',schemaVersion:1,createdAt:now(),stores:{},settings:{}};
 for(const key of BACKUP_STORES)data.stores[key]=await all(key);
 for(const key of BACKUP_KEYS)data.settings[key]=localStorage.getItem(key);
 const zip=backupZipEncode(backupEncoder.encode(JSON.stringify(data)));const url=URL.createObjectURL(zip),a=document.createElement('a');a.href=url;a.download='commission-manager-backup-'+today()+'.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast(lang==='ja'?'ZIPバックアップを作成しました':'ZIP backup created');}
 catch(e){console.error(e);toast(lang==='ja'?'バックアップに失敗しました：'+e.message:'Backup failed: '+e.message)}
}
function selectBackupZip(){document.getElementById('backupZipFile')?.click()}
let pendingBackupRestore=null;
function validateBackupData(data){
 if(!data||data.format!=='commission-manager-full-backup'||data.schemaVersion!==1||!data.stores||!data.settings||Array.isArray(data.stores)||Array.isArray(data.settings))throw Error('対応するバックアップデータではありません。');
 for(const key of BACKUP_STORES){const records=data.stores[key];if(!Array.isArray(records)||records.length>100000)throw Error(key+' のデータ形式が不正です。');const ids=new Set();for(const item of records){if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id||ids.has(item.id))throw Error(key+' に不正または重複したIDがあります。');ids.add(item.id)}}
 for(const key of BACKUP_KEYS)if(!(key in data.settings)||!(data.settings[key]===null||typeof data.settings[key]==='string'))throw Error('設定データが不正です：'+key);
 return data;
}
async function prepareBackupRestore(input){
 const file=input.files?.[0];input.value='';if(!file)return;
 try{if(file.size>32*1024*1024)throw Error('ファイルが大きすぎます（上限32MB）。');const data=validateBackupData(JSON.parse(backupZipDecode(await file.arrayBuffer())));pendingBackupRestore=data;
 const counts=BACKUP_STORES.map(k=>`${k}: ${data.stores[k].length}`).join(' / ');
 modal(`<h2>${lang==='ja'?'ZIPから完全復元':'Full restore from ZIP'}</h2><div class="notice warn">${lang==='ja'?'現在の依頼者・案件・帳票・取引・予定・下書き・設定・ロゴを置き換えます。取り消しできません。復元前に現在のZIPを保存してください。':'All current records, settings and logo will be replaced. This cannot be undone. Save a ZIP of your current data first.'}</div><p class="muted">${esc(data.createdAt||'')}<br>${esc(counts)}</p><label class="check"><input id="restoreAck" type="checkbox">${lang==='ja'?'現在のデータが置き換わることを理解しました':'I understand current data will be replaced'}</label><div class="actions" style="margin-top:18px">${btn(t('cancel'),'pendingBackupRestore=null;closeModal()')}${btn(lang==='ja'?'完全復元を実行':'Restore all data','executeBackupRestore()','danger')}</div>`);
 }catch(e){pendingBackupRestore=null;console.error(e);toast(lang==='ja'?'ZIPを読み込めません：'+e.message:'Invalid ZIP: '+e.message)}
}
async function executeBackupRestore(){
 if(!document.getElementById('restoreAck')?.checked||!pendingBackupRestore)return toast(lang==='ja'?'確認にチェックしてください':'Please confirm first');
 const data=pendingBackupRestore;pendingBackupRestore=null;
 try{
 // One readwrite transaction: all record stores either commit together or roll back together.
 const tx=db.transaction(BACKUP_STORES,'readwrite');const completed=done(tx);
 for(const key of BACKUP_STORES){const os=tx.objectStore(key);os.clear();for(const item of data.stores[key])os.put(item)}
 await completed;
 for(const key of BACKUP_KEYS){if(data.settings[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,data.settings[key])}
 lang=localStorage.getItem('cm-ui-lang')||'ja';theme=localStorage.getItem('cm-ui-theme')||'light';undo=[];selectedClient=null;selectedProject=null;view='Dashboard';closeModal();await loadPdfLogo();applySettings();await render();broadcast('restored','all');toast(lang==='ja'?'完全復元が完了しました':'Full restore completed');
 }catch(e){console.error(e);toast(lang==='ja'?'復元に失敗しました：'+e.message:'Restore failed: '+e.message)}
}
document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('cm-ui-lang',lang);applySettings();render()};document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('cm-ui-theme',theme);applySettings()};init().catch(e=>{document.getElementById('view').innerHTML='<div class="notice warn">'+esc(e.message)+'</div>';console.error(e)});
</script></body></html>
